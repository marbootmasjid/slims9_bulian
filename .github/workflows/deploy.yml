name: Deploy to Production VPS

on:
  push:
    branches:
      - production

jobs:
  deploy:
    name: Deploy to library.stiepemuda.ac.id
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            echo "==> Navigating to SLiMS repository directory..."
            cd ${{ secrets.VPS_PROJECT_DIR }}
            
            echo "==> Configuring Git filemode and fetching production branch..."
            git config core.filemode false
            git fetch origin production
            git reset --hard origin/production
            
            echo "==> Removing installer directory for production security..."
            rm -rf install/
            
            echo "==> Restarting SLiMS Web Container..."
            docker restart library-web
            
            echo "==> Deployment completed successfully!"
